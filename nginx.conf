upstream {
    server app:3000;
}
server {
    listen 8080 default_server;
    server_name _;

    location / {
        proxy_pass http://app;
    }

    location /main {
        proxy_pass http://app/main;
    }

    location /faq {
        proxy_pass http://app/faq;
    }
    
    location /imagens{
        proxy_pass http://app/imagens;
    }

    location /sobre{
        proxy_pass http://app/sobre;
    }
}


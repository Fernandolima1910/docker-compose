services:
  nginx: 
    image: nginx:stable
    hostname: nginx
    container_name: custom.nginx
    ports: 
      - "8080:80"
    volumes: 
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - intranet
    restart: always

  main:
    image: nginx:alpine
    container_name: main_container
    ports: 
      - "8081:80"
    volumes: 
      - ./main:/usr/share/nginx/html/:ro
    networks:
      - intranet
    restart: always

  faq:
    image: nginx:alpine
    container_name: faq_container
    ports:
      - "8082:80"
    volumes:
      - ./faq:/usr/share/nginx/html/:ro
    networks:
      - intranet
    restart: always

  user:
    image: nginx:alpine
    container_name: user_container
    ports:
      - "8083:80"
    volumes:
      - ./user:/usr/share/nginx/html/:ro
    networks:
      - intranet
    restart: always    
  imagens:
    image: nginx:alpine
    container_name: imagens_container
    ports:
      - "8084:80"
    volumes:
      - ./imagens:/usr/share/nginx/html/:ro
    networks:
      - intranet
    restart: always
  sobre:
    image: nginx:alpine
    container_name: sobre_container
    ports:
      - "8085:80"
    volumes:
      - ./sobre:/usr/share/nginx/html/:ro
    networks:
      - intranet
    restart: always

networks:
  intranet:
    driver: bridge